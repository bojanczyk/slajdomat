name: Lint
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        # 18 pre-existing errors remain (import-resolver config gaps + a few
        # switch/case and loop-logic spots that need human review before
        # being "fixed"). Non-blocking until those are cleaned up.
        continue-on-error: true
